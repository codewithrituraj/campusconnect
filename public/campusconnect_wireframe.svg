<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" width="1440" height="1080" style="background:#1e1f22; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-8%" y="-4%" width="116%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#6b7280" />
    </marker>
    <marker id="arrow-active" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#6366f1" />
    </marker>
  </defs>

  <!-- Canvas Header -->
  <g id="header-group" transform="translate(60, 48)">
    <text x="0" y="24" fill="#9ca3af" font-size="22" font-weight="700" letter-spacing="-0.02em">Event Registration — Low-Fidelity Wireframe</text>
    <text x="0" y="48" fill="#6b7280" font-size="14" font-weight="400">Flow reconstructed from the hand-drawn reference</text>
  </g>

  <!-- Flow Connector Lines -->
  <g id="flow-connectors" stroke="#4b5563" stroke-width="2" fill="none" stroke-linecap="round">
    <!-- Screen 1 -> Screen 2 ("continue") -->
    <path d="M 330 330 C 370 330, 400 330, 435 330" marker-end="url(#arrow)"/>
    <rect x="365" y="318" width="56" height="20" rx="4" fill="#1e1f22" stroke="none"/>
    <text x="393" y="332" fill="#9ca3af" font-size="12" font-weight="500" text-anchor="middle">continue</text>

    <!-- Screen 2 -> Screen 3 ("login success") -->
    <path d="M 680 330 C 730 330, 770 330, 815 330" marker-end="url(#arrow)"/>
    <rect x="715" y="318" width="84" height="20" rx="4" fill="#1e1f22" stroke="none"/>
    <text x="757" y="332" fill="#9ca3af" font-size="12" font-weight="500" text-anchor="middle">login success</text>

    <!-- Screen 3 -> Screen 4 ("tap event card") -->
    <path d="M 940 520 C 940 570, 780 580, 680 620" marker-end="url(#arrow)"/>
    <rect x="780" y="565" width="94" height="20" rx="4" fill="#1e1f22" stroke="none"/>
    <text x="827" y="579" fill="#9ca3af" font-size="12" font-weight="500" text-anchor="middle">tap event card</text>
  </g>

  <!-- SCREEN 1: Home Page (Entry point) -->
  <g id="screen-1" transform="translate(100, 100)" filter="url(#card-shadow)">
    <rect width="230" height="430" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <path d="M 0 14 Q 0 0 14 0 L 216 0 Q 230 0 230 14 L 230 46 L 0 46 Z" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <text x="16" y="28" fill="#111827" font-size="13" font-weight="700">Home Page</text>
    <circle cx="210" cy="24" r="8" fill="#9ca3af"/>
    <rect x="26" y="70" width="178" height="82" rx="4" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
    <rect x="42" y="86" width="146" height="18" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
    <rect x="42" y="114" width="100" height="15" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
    <text x="115" y="182" fill="#374151" font-size="12" text-anchor="middle">Welcome / discover events</text>
    <rect x="42" y="226" width="146" height="38" rx="4" fill="#e5e7eb" stroke="#111827" stroke-width="1.75"/>
    <text x="115" y="250" fill="#111827" font-size="13" font-weight="700" text-anchor="middle">Get Started</text>
    <rect x="42" y="280" width="146" height="38" rx="4" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
    <text x="115" y="304" fill="#374151" font-size="12" font-weight="500" text-anchor="middle">Browse events</text>
    <text x="30" y="405" fill="#6b7280" font-size="12">Entry point</text>
  </g>

  <!-- SCREEN 2: Login / Signup -->
  <g id="screen-2" transform="translate(450, 100)" filter="url(#card-shadow)">
    <rect width="230" height="430" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <path d="M 0 14 Q 0 0 14 0 L 216 0 Q 230 0 230 14 L 230 46 L 0 46 Z" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1"/>
    <text x="16" y="28" fill="#111827" font-size="13" font-weight="700">Login / Signup</text>
    <text x="36" y="72" fill="#374151" font-size="12">Login or create account</text>
    <rect x="36" y="105" width="158" height="32" rx="4" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <text x="46" y="125" fill="#6b7280" font-size="11">Email / username</text>
    <rect x="36" y="150" width="158" height="32" rx="4" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <text x="46" y="170" fill="#6b7280" font-size="11">Password</text>
    <rect x="36" y="204" width="158" height="34" rx="4" fill="#e5e7eb" stroke="#111827" stroke-width="1.75"/>
    <text x="115" y="226" fill="#111827" font-size="13" font-weight="700" text-anchor="middle">Login</text>
    <line x1="36" y1="268" x2="194" y2="268" stroke="#9ca3af" stroke-width="1.25"/>
    <rect x="104" y="258" width="22" height="18" fill="#ffffff"/>
    <text x="115" y="271" fill="#6b7280" font-size="11" text-anchor="middle">or</text>
    <rect x="36" y="292" width="158" height="34" rx="4" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
    <text x="115" y="314" fill="#374151" font-size="12" font-weight="500" text-anchor="middle">Sign up</text>
    <text x="30" y="405" fill="#6b7280" font-size="12">Authenticate user</text>
  </g>

  <!-- SCREEN 3: Home Page (Events Listing) -->
  <g id="screen-3" transform="translate(830, 100)" filter="url(#card-shadow)">
    <rect width="230" height="430" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <path d="M 0 14 Q 0 0 14 0 L 216 0 Q 230 0 230 14 L 230 46 L 0 46 Z" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <text x="16" y="28" fill="#111827" font-size="13" font-weight="700">Home Page</text>
    <circle cx="210" cy="24" r="8" fill="#9ca3af"/>
    <rect x="22" y="62" width="186" height="30" rx="4" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <text x="32" y="82" fill="#6b7280" font-size="11">Search events</text>
    <g transform="translate(22, 106)">
      <rect width="186" height="74" rx="4" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
      <rect x="15" y="13" width="75" height="48" rx="3" fill="#e5e7eb" stroke="#374151" stroke-width="1.25"/>
      <text x="102" y="32" fill="#111827" font-size="11" font-weight="600">Event card 1</text>
      <text x="102" y="48" fill="#6b7280" font-size="10">Date / venue</text>
    </g>
    <g transform="translate(22, 192)">
      <rect width="186" height="74" rx="4" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
      <rect x="15" y="13" width="75" height="48" rx="3" fill="#e5e7eb" stroke="#374151" stroke-width="1.25"/>
      <text x="102" y="32" fill="#111827" font-size="11" font-weight="600">Event card 2</text>
      <text x="102" y="48" fill="#6b7280" font-size="10">Date / venue</text>
    </g>
    <g transform="translate(22, 278)">
      <rect width="186" height="74" rx="4" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
      <rect x="15" y="13" width="75" height="48" rx="3" fill="#e5e7eb" stroke="#374151" stroke-width="1.25"/>
      <text x="102" y="32" fill="#111827" font-size="11" font-weight="600">Event card 3</text>
      <text x="102" y="48" fill="#6b7280" font-size="10">Date / venue</text>
    </g>
    <text x="28" y="405" fill="#6b7280" font-size="12">Select an event</text>
  </g>

  <!-- SCREEN 4: Registration Page (Submit) -->
  <g id="screen-4" transform="translate(450, 580)" filter="url(#card-shadow)">
    <rect width="230" height="430" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <path d="M 0 14 Q 0 0 14 0 L 216 0 Q 230 0 230 14 L 230 46 L 0 46 Z" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1"/>
    <text x="16" y="28" fill="#111827" font-size="13" font-weight="700">Registration Page</text>
    <text x="36" y="70" fill="#374151" font-size="12">Event details</text>
    <rect x="36" y="92" width="158" height="32" rx="4" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
    <text x="46" y="112" fill="#374151" font-size="11" font-weight="500">Selected event</text>
    <rect x="36" y="136" width="158" height="32" rx="4" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <text x="46" y="156" fill="#6b7280" font-size="11">Full name</text>
    <rect x="36" y="180" width="158" height="32" rx="4" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <text x="46" y="200" fill="#6b7280" font-size="11">Email</text>
    <rect x="36" y="224" width="158" height="32" rx="4" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <text x="46" y="244" fill="#6b7280" font-size="11">Phone / ID</text>
    <rect x="36" y="280" width="158" height="36" rx="4" fill="#e5e7eb" stroke="#111827" stroke-width="1.75"/>
    <text x="115" y="303" fill="#111827" font-size="13" font-weight="700" text-anchor="middle">Register</text>
    <text x="28" y="390" fill="#6b7280" font-size="12">Submit registration</text>
  </g>

  <!-- Bottom Explanatory Caption -->
  <text x="100" y="625" fill="#6b7280" font-size="12">Grayscale boxes and labels are intentionally schematic; all elements are editable after SVG import.</text>
</svg>
